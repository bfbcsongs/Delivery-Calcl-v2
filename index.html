<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miki Client Table</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

.table-container {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    background: white;
    border: 1px solid #d1d5db;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

/* Column Widths */
colgroup col:nth-child(1) { width: 20%; }
colgroup col:nth-child(2) { width: 10%; }
colgroup col:nth-child(3) { width: 10%; }
colgroup col:nth-child(4) { width: 10%; }
colgroup col:nth-child(5) { width: 10%; }
colgroup col:nth-child(6) { width: 10%; }
colgroup col:nth-child(7) { width: 10%; }
colgroup col:nth-child(8) { width: 20%; }

th, td {
    border: 1px solid #d1d5db;
    height: 28px;
    padding: 2px 4px;
    text-align: center;
    vertical-align: middle;
    font-size: 13px;
}

th {
    background: #111827;
    color: white;
    font-weight: bold;
}

td input {
    width: 100%;
    height: 24px;
    padding: 2px;
    border: 1px solid #9ca3af;
    border-radius: 3px;
    text-align: center;
    font-size: 13px;
    background: white;
}

td input[type="text"] {
    text-align: left;
    padding-left: 6px;
}

td input:focus {
    outline: 2px solid #94a3b8;
}

.amount-cell {
    font-weight: bold;
    text-align: right;
    padding-right: 8px;
}

.total-row td {
    background: #e5e7eb;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="table-container">
    <table id="mikiTable">
        <colgroup>
            <col><col><col><col><col><col><col><col>
        </colgroup>
        <thead>
            <tr>
                <th>Names</th>
                <th>Dry</th>
                <th>Fresh</th>
                <th>Cab</th>
                <th>BO</th>
                <th>Bal</th>
                <th>Pay</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Rows 2 to 17 will be generated here via JavaScript -->
        </tbody>
        <tfoot>
            <!-- Row 18: Total Row -->
            <tr class="total-row">
                <td style="text-align: left; padding-left: 6px;">TOTAL</td>
                <td id="totDry">0</td>
                <td id="totFresh">0</td>
                <td id="totCab">0</td>
                <td id="totBo">0</td>
                <td id="totBal">0</td>
                <td id="totPay">0</td>
                <td class="amount-cell" id="totAmount">0</td>
            </tr>
        </tfoot>
    </table>
</div>

<script>
function formatMoney(value) {
    return value.toLocaleString("en-US", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
    });
}

// Generate Rows 2 to 17 (16 client rows)
function buildTable() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    for (let i = 0; i < 16; i++) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><input type="text" class="c-name" data-index="${i}" placeholder="Client ${i+1}"></td>
            <td><input type="number" min="0" step="any" class="c-dry" data-index="${i}" oninput="calculateAll()"></td>
            <td><input type="number" min="0" step="any" class="c-fresh" data-index="${i}" oninput="calculateAll()"></td>
            <td><input type="number" min="0" step="any" class="c-cab" data-index="${i}" oninput="calculateAll()"></td>
            <td><input type="number" min="0" step="any" class="c-bo" data-index="${i}" oninput="calculateAll()"></td>
            <td><input type="number" min="0" step="any" class="c-bal" data-index="${i}" oninput="calculateAll()"></td>
            <td><input type="number" min="0" step="any" class="c-pay" data-index="${i}" oninput="calculateAll()"></td>
            <td class="amount-cell c-amount" id="amount_${i}">0</td>
        `;
        tbody.appendChild(tr);
    }
    loadData();
}

function calculateAll() {
    const names = document.querySelectorAll(".c-name");
    const drys = document.querySelectorAll(".c-dry");
    const freshs = document.querySelectorAll(".c-fresh");
    const cabs = document.querySelectorAll(".c-cab");
    const bos = document.querySelectorAll(".c-bo");
    const bals = document.querySelectorAll(".c-bal");
    const pays = document.querySelectorAll(".c-pay");

    let sumDry = 0, sumFresh = 0, sumCab = 0, sumBo = 0, sumBal = 0, sumPay = 0, sumAmount = 0;

    let savedData = [];

    for (let i = 0; i < 16; i++) {
        const dryVal = parseFloat(drys[i].value) || 0;
        const freshVal = parseFloat(freshs[i].value) || 0;
        const cabVal = parseFloat(cabs[i].value) || 0;
        const boVal = parseFloat(bos[i].value) || 0;
        const balVal = parseFloat(bals[i].value) || 0;
        const payVal = parseFloat(pays[i].value) || 0;
        const nameVal = names[i].value;

        // Computation per client row: 
        // Dry @ 45, Fresh @ 45, Cab @ 40, BO @ 45 (divided by 2), plus Bal, minus Pay
        const regAmt = dryVal * 45;
        const freshAmt = freshVal * 45;
        const cabAmt = cabVal * 40;
        const boAmt = (boVal / 2) * 45;

        const rowTotal = regAmt + freshAmt + cabAmt - boAmt + balVal - payVal;

        document.getElementById("amount_" + i).textContent = formatMoney(rowTotal);

        sumDry += dryVal;
        sumFresh += freshVal;
        sumCab += cabVal;
        sumBo += boVal;
        sumBal += balVal;
        sumPay += payVal;
        sumAmount += rowTotal;

        savedData.push({
            name: nameVal,
            dry: drys[i].value,
            fresh: freshs[i].value,
            cab: cabs[i].value,
            bo: bos[i].value,
            bal: bals[i].value,
            pay: pays[i].value
        });
    }

    // Update Row 18 (Totals)
    document.getElementById("totDry").textContent = sumDry ? formatMoney(sumDry) : "0";
    document.getElementById("totFresh").textContent = sumFresh ? formatMoney(sumFresh) : "0";
    document.getElementById("totCab").textContent = sumCab ? formatMoney(sumCab) : "0";
    document.getElementById("totBo").textContent = sumBo ? formatMoney(sumBo) : "0";
    document.getElementById("totBal").textContent = sumBal ? formatMoney(sumBal) : "0";
    document.getElementById("totPay").textContent = sumPay ? formatMoney(sumPay) : "0";
    document.getElementById("totAmount").textContent = formatMoney(sumAmount);

    localStorage.setItem("miki_18_rows_data", JSON.stringify(savedData));
}

function loadData() {
    const saved = localStorage.getItem("miki_18_rows_data");
    if (!saved) return;

    const data = JSON.parse(saved);
    const names = document.querySelectorAll(".c-name");
    const drys = document.querySelectorAll(".c-dry");
    const freshs = document.querySelectorAll(".c-fresh");
    const cabs = document.querySelectorAll(".c-cab");
    const bos = document.querySelectorAll(".c-bo");
    const bals = document.querySelectorAll(".c-bal");
    const pays = document.querySelectorAll(".c-pay");

    data.forEach((item, i) => {
        if (i < 16) {
            names[i].value = item.name || "";
            drys[i].value = item.dry || "";
            freshs[i].value = item.fresh || "";
            cabs[i].value = item.cab || "";
            bos[i].value = item.bo || "";
            bals[i].value = item.bal || "";
            pays[i].value = item.pay || "";
        }
    });

    // Add event listener to names to save on input
    names.forEach((input) => {
        input.addEventListener("input", calculateAll);
    });

    calculateAll();
}

window.onload = function() {
    buildTable();
};
</script>

</body>
</html>
